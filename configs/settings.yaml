# Data paths
data:
  raw_pdf_dir: data/raw_pdfs
  chunks_path: data/chunks/chunks.json

# Vector database
vector_db:
  index_path: vector.index
  metadata_path: metadata.pkl
  top_k: 5

# Embeddings
embeddings:
  model: text-embedding-3-small
  batch_size: 100

# LLM providers
llm:
  default_provider: openai

openai:
  model: gpt-4.1-mini
  temperature: 0.2

gemini:
  model: models/gemini-1.5-flash

